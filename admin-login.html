<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Login | EventWale</title>

  <link rel="stylesheet" href="admin-login.css">
    <link rel="stylesheet" href="motion.css">
    <link rel="stylesheet" href="responsive-final.css">
    <link rel="icon" type="image/svg+xml" href="eventwale-logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="eventwale-neon.css">
    <link rel="stylesheet" href="eventwale-fixes.css">
</head>

<body>

  <div class="login-container">

    <div class="brand">
      <h1 class="ew-logo ew-lg"><svg class="ew-mark" viewBox="0 0 64 64" aria-hidden="true"><rect x="2" y="2" width="60" height="60" rx="16" fill="#b8f03c"/><rect x="14" y="19" width="36" height="31" rx="7" fill="none" stroke="#0b1004" stroke-width="4.5"/><path d="M22 13v10M42 13v10M14 29h36" stroke="#0b1004" stroke-width="4.5" stroke-linecap="round"/><path d="M24 40l6 6 11-12" fill="none" stroke="#0b1004" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="ew-word">EVENT<b>WALE</b></span></h1>
      <p>ADMINISTRATION PORTAL</p>
    </div>

    <div class="login-card">

      <div class="admin-icon">♛</div>

      <h2>Welcome Back</h2>

      <p class="subtitle">
        Sign in to manage your event platform
      </p>

      <form id="adminLoginForm">

        <label for="adminEmail">Admin Email</label>

        <input
          type="email"
          id="adminEmail"
          placeholder="Enter admin email"
          autocomplete="username"
          required
        >

        <label for="adminPassword">Password</label>

        <input
          type="password"
          id="adminPassword"
          placeholder="Enter password"
          autocomplete="current-password"
          required
        >

        <button type="submit" id="loginButton">
          Sign In to Dashboard
        </button>

        <p id="message" role="status"></p>

      </form>

      <a href="login.html" class="back-link">
        ← Back to User Login
      </a>

    </div>

    <p class="footer">
      © 2026 EVENTWALE · Admin Portal
    </p>

  </div>

<script type="module" src="admin-login.js"></script>

    <script src="smart-enhancements.js" defer></script>
<script src="image-fallback.js" defer></script>
</body>
</html>
