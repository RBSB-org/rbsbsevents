<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Bookings | EventWale</title>

    <style>
        :root {
            --primary: #14243A;
            --accent: #C5A46D;
            --page-bg: #FAF8F3;
            --surface: #FFFFFF;
            --text: #273444;
            --muted: #667085;
            --border: #E7E2D8;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--page-bg);
            color: var(--text);
            min-height: 100vh;
        }

        header {
            padding: 20px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .navbar {
            max-width: 1100px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .logo {
            color: var(--primary);
            font-size: 23px;
            font-weight: bold;
            text-decoration: none;
        }

        .back-link {
            color: var(--text);
            text-decoration: none;
            border: 1px solid var(--accent);
            padding: 10px 14px;
            border-radius: 8px;
        }

        main {
            max-width: 1100px;
            margin: 35px auto;
            padding: 20px;
        }

        .heading {
            margin-bottom: 25px;
        }

        .heading h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .heading p {
            color: var(--muted);
            line-height: 1.6;
        }

        #message {
            padding: 16px;
            margin-bottom: 20px;
            background: var(--surface);
            border-radius: 10px;
            color: var(--text);
            line-height: 1.6;
        }

        .booking-list {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(min(100%, 280px), 1fr)
            );
            gap: 20px;
        }

        .booking-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 22px;
            min-width: 0;
        }

        .booking-card h2 {
            font-size: 21px;
            color: var(--primary);
            margin-bottom: 15px;
            overflow-wrap: anywhere;
        }

        .detail {
            margin: 12px 0;
            color: var(--text);
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .status {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            margin-top: 8px;
            background: color-mix(in srgb, var(--accent) 20%, var(--surface));
            color: var(--text);
        }

        .status.approved {
            background: #153e2c;
            color: #7df0ad;
        }

        .status.rejected {
            background: #4b2027;
            color: #ff9aa5;
        }

        .booking-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        .booking-actions button {
            flex: 1;
            min-width: 120px;
            padding: 12px 10px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        .edit-booking-button {
            background: var(--accent);
            color: #111827;
        }

        .edit-booking-button:hover {
            background: var(--accent);
        }

        .delete-booking-button {
            background: #702832;
            color: var(--text);
        }

        .delete-booking-button:hover {
            background: #963744;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .edit-booking-form {
            margin-top: 20px;
            padding: 18px;
            background: var(--page-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .edit-booking-form h3 {
            color: var(--primary);
            margin-bottom: 10px;
        }

        .edit-booking-form label {
            display: block;
            margin-top: 14px;
            color: var(--text);
            font-size: 14px;
        }

        .edit-booking-form input,
        .edit-booking-form select,
        .edit-booking-form textarea {
            width: 100%;
            margin-top: 7px;
            padding: 11px;
            border: 1px solid #46516e;
            border-radius: 7px;
            background: var(--surface);
            color: white;
            font: inherit;
        }

        .edit-booking-form textarea {
            min-height: 90px;
            resize: vertical;
        }

        .edit-form-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 18px;
        }

        .edit-form-actions button {
            flex: 1;
            min-width: 110px;
            padding: 12px;
            border: none;
            border-radius: 7px;
            font-weight: bold;
            cursor: pointer;
        }

        .save-booking-button {
            background: var(--accent);
            color: #111827;
        }

        .cancel-edit-button {
            background: #303954;
            color: white;
        }

        .book-button {
            display: inline-block;
            margin-top: 25px;
            background: var(--accent);
            color: #111827;
            text-decoration: none;
            font-weight: bold;
            padding: 13px 18px;
            border-radius: 8px;
        }

        footer {
            text-align: center;
            color: #929bb6;
            padding: 25px;
            margin-top: 35px;
        }

        @media (max-width: 480px) {
            main {
                padding: 15px;
            }

            .heading h1 {
                font-size: 27px;
            }

            .booking-card {
                padding: 17px;
            }
        }
    </style>

<style id="ew-fixes-inline">
/* EventWale — layout & image fixes (loaded LAST on every page) */

/* 1. Hero headings / paragraphs: truly centred on every inner page */
html body :is(.events-hero, .venues-hero, .services-hero, .about-hero, .contact-hero, .budget-hero, .booking-hero) .container,
html body :is(.events-hero-content, .venues-hero-content, .services-hero-content, .about-hero-content, .contact-hero-content, .budget-hero-content, .booking-hero-content) {
  text-align: center !important;
  margin-left: auto !important;
  margin-right: auto !important;
}
html body :is(.events-hero, .venues-hero, .services-hero, .about-hero, .contact-hero, .budget-hero, .booking-hero) h1 {
  margin-left: auto !important;
  margin-right: auto !important;
  text-align: center !important;
}
html body :is(.events-hero, .venues-hero, .services-hero, .about-hero, .contact-hero, .budget-hero, .booking-hero) p {
  margin-left: auto !important;
  margin-right: auto !important;
  text-align: center !important;
}
html body :is(.events-hero, .venues-hero, .services-hero, .about-hero, .contact-hero, .budget-hero, .booking-hero) .breadcrumb {
  justify-content: center !important;
}

/* 2. "SERVICE 01/02/03" label: a centred pill, not a stretched ellipse */
html body .service-card .service-number {
  display: block !important;
  width: fit-content !important;
  margin: 4px auto 14px !important;
  padding: 7px 20px !important;
  border-radius: 999px !important;
  text-align: center !important;
  line-height: 1.2 !important;
  font-size: 12px !important;
  letter-spacing: .16em !important;
}
html body .service-card .service-card-content > h3 { text-align: center; }

/* 3. Contact page consent tick: sits right in front of its text */
html body .contact-checkbox-field {
  display: flex !important;
  flex-direction: row !important;
  align-items: center !important;
  gap: 12px !important;
  padding: 0 !important;
  border: 0 !important;
  background: transparent !important;
}
html body .contact-checkbox-field input[type="checkbox"] {
  flex: 0 0 20px !important;
  width: 20px !important;
  height: 20px !important;
  min-height: 0 !important;
  margin: 0 !important;
  padding: 0 !important;
  accent-color: #b8f03c;
  cursor: pointer;
}
html body .contact-checkbox-field label {
  flex: 1 1 auto !important;
  margin: 0 !important;
  font-size: 14px !important;
  line-height: 1.5 !important;
  cursor: pointer;
}

/* 4. Images: keep a photo + dark overlay on the home "why choose" panel */
html body .why-choose-image:not(#ew) {
  background:
    linear-gradient(0deg, rgba(5, 7, 4, .88), rgba(5, 7, 4, .15) 70%),
    url("https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1000&q=80") center / cover no-repeat,
    url("eventwale-image-fallback.svg") center / cover no-repeat !important;
}
html body .why-choose-image.img-fallback:not(#ew) {
  background: linear-gradient(0deg, rgba(5, 7, 4, .6), rgba(5, 7, 4, .1) 70%),
    url("eventwale-image-fallback.svg") center / cover no-repeat !important;
}
/* photo cards that failed to load show the neon placeholder instead of a blank box */
html body .venue-image.img-fallback,
html body .event-card-image.img-fallback,
html body .category-image.img-fallback,
html body .service-image.img-fallback {
  background: #14170d url("eventwale-image-fallback.svg") center / cover no-repeat !important;
}
html body :is(.venue-image, .service-image) img { display: block; width: 100%; height: 100%; object-fit: cover; }

/* 5. "Enquire Now" / "View Service Details" buttons: label centred */
html body .service-card :is(.service-link, .service-details-btn, .service-card-content > a) {
  display: flex !important; align-items: center; justify-content: center; text-align: center !important;
}

/* 6. Home "Event categories" fan — stop the hover shaking.
   Cause: on hover the card straightened, lifted ~48px and the idle float animation restarted, so the card's
   lower edge slid out from under the cursor -> hover lost -> card dropped back -> hover again (flicker).
   Fix: no float animation, and hover only grows the card from its bottom edge (rotation/position unchanged),
   so the pointer always stays inside the card. */
html body .category-grid .category-card {
  animation: none !important;
  transform-origin: 50% 100% !important;
  will-change: transform;
}
html body .category-grid .category-card:hover,
html body .category-grid .category-card:focus-visible,
html body .category-grid .category-card.is-focused {
  transform: translate(-50%, -50%) rotate(var(--deck-rotate, 0deg)) translateX(var(--deck-x, 0px)) translateY(var(--deck-y, 0px)) scale(calc(var(--deck-scale, 1) * 1.07)) !important;
  z-index: 20 !important;
}
@media (max-width: 900px) {
  html body .category-grid .category-card:hover,
  html body .category-grid .category-card:focus-visible,
  html body .category-grid .category-card.is-focused { transform: scale(1.03) !important; }
}

/* 7. Review stars: empty outline by default, fill + pop animation when tapped */
html body:not(#ew) .rating-picker { gap: 8px !important; padding: 6px 12px !important; }
html body:not(#ew) .rating-picker label {
  font-size: 40px !important; line-height: 1.2 !important;
  color: transparent !important;                       /* empty */
  -webkit-text-stroke: 2px rgba(184, 240, 60, .75);
  cursor: pointer; user-select: none;
  transition: color .2s ease, transform .2s cubic-bezier(.3, 1.6, .5, 1), -webkit-text-stroke-color .2s ease, filter .2s ease !important;
}
/* hover preview: fills this star and the ones before it, slight grow */
html body:not(#ew) .rating-picker label:hover,
html body:not(#ew) .rating-picker label:hover ~ label {
  color: rgba(184, 240, 60, .45) !important; -webkit-text-stroke-color: #b8f03c;
}
html body:not(#ew) .rating-picker label:hover { transform: scale(1.18); }
/* selected: solid lime stars with a glow + staggered pop */
html body:not(#ew) .rating-picker input:checked ~ label {
  color: #b8f03c !important; -webkit-text-stroke-color: #b8f03c;
  filter: drop-shadow(0 0 8px rgba(184, 240, 60, .6));
  animation: ew-star-pop .45s cubic-bezier(.3, 1.6, .5, 1) both;
}
html body:not(#ew) .rating-picker input:checked ~ label:nth-of-type(5) { animation-delay: 0s; }
html body:not(#ew) .rating-picker input:checked ~ label:nth-of-type(4) { animation-delay: .06s; }
html body:not(#ew) .rating-picker input:checked ~ label:nth-of-type(3) { animation-delay: .12s; }
html body:not(#ew) .rating-picker input:checked ~ label:nth-of-type(2) { animation-delay: .18s; }
html body:not(#ew) .rating-picker input:checked ~ label:nth-of-type(1) { animation-delay: .24s; }
html body:not(#ew) .rating-picker label:active { transform: scale(.9); }
@keyframes ew-star-pop {
  0%   { transform: scale(.6) rotate(-25deg); }
  60%  { transform: scale(1.3) rotate(8deg); }
  100% { transform: scale(1) rotate(0); }
}
@media (prefers-reduced-motion: reduce) {
  html body:not(#ew) .rating-picker input:checked ~ label { animation: none; }
}

</style>

<body>

    <header>
        <nav class="navbar">
            <a href="index.html" class="logo ew-logo" aria-label="EventWale home"><svg class="ew-mark" viewBox="0 0 64 64" aria-hidden="true"><rect x="2" y="2" width="60" height="60" rx="16" fill="#b8f03c"/><rect x="14" y="19" width="36" height="31" rx="7" fill="none" stroke="#0b1004" stroke-width="4.5"/><path d="M22 13v10M42 13v10M14 29h36" stroke="#0b1004" stroke-width="4.5" stroke-linecap="round"/><path d="M24 40l6 6 11-12" fill="none" stroke="#0b1004" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="ew-word">EVENT<b>WALE</b></span></a>
            <a href="index.html" class="back-link">← Home</a>
        </nav>
    </header>

    <main>

        <section class="heading">
            <h1>My Bookings 📋</h1>
            <p>
                Track your event requests and check their latest status.
            </p>
        </section>

        <div id="message" role="status" aria-live="polite">
            Checking your login...
        </div>

        <section
            id="bookingList"
            class="booking-list"
            aria-label="Your bookings">
        </section>

        <a href="booking.html" class="book-button">
            + Book Another Event
        </a>

    </main>

    <footer>
        © 2026 EventWale. Make every moment memorable.
    </footer>

    <script type="module">

        import { auth, db } from "./firebase.js";

        import {
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

        import {
            ref,
            get,
            update,
            remove
        } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-database.js";


        const message = document.getElementById("message");
        const bookingList = document.getElementById("bookingList");

        let currentUser = null;
        let loadNumber = 0;


        function escapeHTML(value) {
            return String(value ?? "").replace(/[&<>"']/g, char => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            })[char]);
        }


        function formatDate(value) {
            if (!value) return "Not specified";

            const text = String(value);
            const date = new Date(text + "T00:00:00");

            return Number.isNaN(date.getTime())
                ? escapeHTML(text)
                : date.toLocaleDateString("en-IN", {
                    day: "numeric",
                    month: "short",
                    year: "numeric"
                });
        }


        function getStatus(booking) {
            const status = String(
                booking.status || "pending"
            ).toLowerCase();

            if (["pending", "approved", "rejected"].includes(status)) {
                return status;
            }

            return "unknown";
        }


        function isPending(booking) {
            return getStatus(booking) === "pending";
        }


        function createBookingCard(booking) {
            const status = getStatus(booking);

            const card = document.createElement("article");
            card.className = "booking-card";

            const venue =
                booking.preferredVenue ||
                booking.venuePreference ||
                "Not specified";

            card.innerHTML = `
                <h2>${escapeHTML(booking.eventName || "Event Booking")}</h2>

                <p class="detail">
                    <strong>Booking ID:</strong>
                    ${escapeHTML(booking.bookingId || "N/A")}
                </p>

                <p class="detail">
                    <strong>Event date:</strong>
                    ${formatDate(booking.eventDate)}
                </p>

                <p class="detail">
                    <strong>Time:</strong>
                    ${escapeHTML(booking.eventTime || "Not specified")}
                </p>

                <p class="detail">
                    <strong>Event type:</strong>
                    ${escapeHTML(booking.eventType || "Not specified")}
                </p>

                <p class="detail">
                    <strong>City:</strong>
                    ${escapeHTML(booking.eventCity || "Not specified")}
                </p>

                <p class="detail">
                    <strong>Venue:</strong>
                    ${escapeHTML(venue)}
                </p>

                <p class="detail">
                    <strong>Guests:</strong>
                    ${escapeHTML(booking.guestCount ?? "Not specified")}
                </p>

                <p class="detail">
                    <strong>Budget:</strong>
                    ${escapeHTML(booking.eventBudget || "Not specified")}
                </p>

                <span class="status ${escapeHTML(status)}">
                    ${escapeHTML(
                        status.charAt(0).toUpperCase() + status.slice(1)
                    )}
                </span>

                ${
                    status === "pending"
                    ? `
                        <div class="booking-actions">
                            <button
                                type="button"
                                class="edit-booking-button">
                                ✏️ Edit Booking
                            </button>

                            <button
                                type="button"
                                class="delete-booking-button">
                                🗑️ Delete Booking
                            </button>
                        </div>
                    `
                    : `
                        <p class="detail">
                            🔒 This booking cannot be edited or deleted because
                            its status is ${escapeHTML(status)}.
                        </p>
                    `
                }
            `;

            if (status === "pending") {
                card.querySelector(".edit-booking-button")
                    .addEventListener("click", () => {
                        showEditForm(card, booking);
                    });

                card.querySelector(".delete-booking-button")
                    .addEventListener("click", () => {
                        deleteBooking(card, booking);
                    });
            }

            return card;
        }
                function showEditForm(card, booking) {

            if (!currentUser || !isPending(booking)) {
                alert("Only pending bookings can be edited.");
                return;
            }

            if (card.querySelector(".edit-booking-form")) {
                return;
            }

            const form = document.createElement("form");
            form.className = "edit-booking-form";

            form.innerHTML = `
                <h3>Edit Your Booking</h3>

                <label>
                    Event Name
                    <input type="text" name="eventName"
                        maxlength="120" required>
                </label>

                <label>
                    Event Type
                    <input type="text" name="eventType"
                        maxlength="100" required>
                </label>

                <label>
                    Event Date
                    <input type="date" name="eventDate" required>
                </label>

                <label>
                    Event Time
                    <input type="time" name="eventTime" required>
                </label>

                <label>
                    Event City
                    <input type="text" name="eventCity"
                        maxlength="100" required>
                </label>

                <label>
                    Preferred Venue
                    <input type="text" name="preferredVenue"
                        maxlength="200">
                </label>

                <label>
                    Number of Guests
                    <input type="number" name="guestCount"
                        min="1" max="100000" step="1" required>
                </label>

                <label>
                    Event Budget
                    <input type="text" name="eventBudget"
                        maxlength="100" required>
                </label>

                <label>
                    Event Requirements
                    <textarea name="eventRequirements"
                        maxlength="3000"></textarea>
                </label>

                <div class="edit-form-actions">
                    <button type="submit"
                        class="save-booking-button">
                        💾 Save Changes
                    </button>

                    <button type="button"
                        class="cancel-edit-button">
                        Cancel
                    </button>
                </div>

                <p class="detail edit-message"
                    aria-live="polite"></p>
            `;

            form.elements.eventName.value = booking.eventName || "";
            form.elements.eventType.value = booking.eventType || "";
            form.elements.eventDate.value = booking.eventDate || "";
            form.elements.eventTime.value = booking.eventTime || "";
            form.elements.eventCity.value = booking.eventCity || "";

            form.elements.preferredVenue.value =
                booking.preferredVenue ||
                booking.venuePreference ||
                "";

            form.elements.guestCount.value =
                booking.guestCount ?? "";

            form.elements.eventBudget.value =
                booking.eventBudget ?? "";

            form.elements.eventRequirements.value =
                booking.eventRequirements || "";

            card.appendChild(form);

            form.querySelector(".cancel-edit-button")
                .addEventListener("click", () => {
                    form.remove();
                });

            form.addEventListener("submit", async event => {

                event.preventDefault();

                if (!currentUser) {
                    alert("Please sign in again.");
                    return;
                }

                if (!form.reportValidity()) {
                    return;
                }

                const saveButton =
                    form.querySelector(".save-booking-button");

                const cancelButton =
                    form.querySelector(".cancel-edit-button");

                const editMessage =
                    form.querySelector(".edit-message");

                saveButton.disabled = true;
                cancelButton.disabled = true;

                editMessage.textContent = "Saving your changes...";

                try {
                    const bookingRef = ref(
                        db,
                        `bookings/${currentUser.uid}/${booking.bookingId}`
                    );

                    const latestSnapshot = await get(bookingRef);

                    if (!latestSnapshot.exists()) {
                        throw new Error(
                            "This booking no longer exists."
                        );
                    }

                    const latestBooking = latestSnapshot.val();

                    if (getStatus(latestBooking) !== "pending") {
                        throw new Error(
                            "This booking is no longer pending."
                        );
                    }

                    const updatedFields = {
                        eventName: form.elements.eventName.value.trim(),
                        eventType: form.elements.eventType.value.trim(),
                        eventDate: form.elements.eventDate.value,
                        eventTime: form.elements.eventTime.value,
                        eventCity: form.elements.eventCity.value.trim(),
                        guestCount: Number(form.elements.guestCount.value),
                        eventRequirements:
                            form.elements.eventRequirements.value.trim(),
                        eventBudget:
                            form.elements.eventBudget.value.trim(),
                        updatedAt: Date.now()
                    };

                    const preferredVenue =
                        form.elements.preferredVenue.value.trim();

                    if (preferredVenue) {
                        updatedFields.preferredVenue = preferredVenue;
                    }

                    await update(bookingRef, updatedFields);

                    alert(
                        "Your booking has been updated successfully!"
                    );

                    await loadBookings(currentUser);

                } catch (error) {
                    console.error("Booking update failed:", error);

                    editMessage.textContent =
                        error.code === "PERMISSION_DENIED"
                        ? "Firebase denied this update. Check your Database Rules."
                        : error.message ||
                          "Unable to update this booking.";

                    saveButton.disabled = false;
                    cancelButton.disabled = false;
                }
            });
        }


        async function deleteBooking(card, booking) {

            if (!currentUser || !isPending(booking)) {
                alert("Only pending bookings can be deleted.");
                return;
            }

            const confirmed = confirm(
                "Are you sure you want to delete this booking? This action cannot be undone."
            );

            if (!confirmed) {
                return;
            }

            const deleteButton =
                card.querySelector(".delete-booking-button");

            if (deleteButton) {
                deleteButton.disabled = true;
                deleteButton.textContent = "Deleting...";
            }

            try {
                const bookingRef = ref(
                    db,
                    `bookings/${currentUser.uid}/${booking.bookingId}`
                );

                const latestSnapshot = await get(bookingRef);

                if (!latestSnapshot.exists()) {
                    throw new Error(
                        "This booking has already been deleted."
                    );
                }

                const latestBooking = latestSnapshot.val();

                if (getStatus(latestBooking) !== "pending") {
                    throw new Error(
                        "This booking is no longer pending."
                    );
                }

                await remove(bookingRef);

                alert("Your booking has been deleted successfully!");

                await loadBookings(currentUser);

            } catch (error) {
                console.error("Booking deletion failed:", error);

                alert(
                    error.code === "PERMISSION_DENIED"
                    ? "Firebase denied deletion. Check your Database Rules."
                    : error.message ||
                      "Unable to delete the booking."
                );

                if (deleteButton) {
                    deleteButton.disabled = false;
                    deleteButton.textContent = "🗑️ Delete Booking";
                }
            }
        }


        async function loadBookings(user) {

            if (!user) return;

            const thisLoad = ++loadNumber;

            bookingList.replaceChildren();
            message.textContent = "Loading your bookings...";

            try {
                const snapshot = await get(
                    ref(db, `bookings/${user.uid}`)
                );

                if (
                    thisLoad !== loadNumber ||
                    !currentUser ||
                    currentUser.uid !== user.uid
                ) {
                    return;
                }

                if (!snapshot.exists()) {
                    message.textContent =
                        "You haven't made any bookings yet. Book your first event!";

                    return;
                }

                const bookings = [];

                snapshot.forEach(child => {
                    bookings.push({
                        ...child.val(),
                        bookingId: child.key
                    });
                });

                bookings.sort((a, b) => {
                    const dateA = Number(a.createdAt) || 0;
                    const dateB = Number(b.createdAt) || 0;

                    return dateB - dateA;
                });

                bookings.forEach(booking => {
                    bookingList.appendChild(
                        createBookingCard(booking)
                    );
                });

                message.textContent =
                    `You have ${bookings.length} booking request(s).`;

            } catch (error) {
                console.error("Unable to load bookings:", error);

                if (thisLoad !== loadNumber) return;

                message.textContent =
                    error.code === "PERMISSION_DENIED"
                    ? "Access denied. Please check your Firebase Database Rules."
                    : "We couldn't load your bookings. Please check your connection and try again.";
            }
        }


        onAuthStateChanged(auth, async user => {

            currentUser = user;
            loadNumber++;

            bookingList.replaceChildren();

            if (!user) {
                message.textContent =
                    "Please sign in to view your bookings.";

                return;
            }

            await loadBookings(user);
        });

    </script>
